server.port=0

# --- container image layer analyzer ---
# I/O buffer per stream (bytes); bounds per-layer memory usage
analyzer.buffer-size-bytes=65536
# worker threads shared by all scan/optimize tasks
analyzer.worker-threads=2
# max wall-clock time per task before it is failed with TIMEOUT
analyzer.task-timeout-millis=600000
# directory for temporary intermediate output
analyzer.temp-dir=${java.io.tmpdir}
# max entries kept per layer in the report (top-N by size)
analyzer.max-report-entries-per-layer=10000
